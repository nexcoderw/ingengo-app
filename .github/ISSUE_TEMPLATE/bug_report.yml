name: Bug report
description: Report a reproducible problem with the Flutter app.
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities through the [security policy](https://github.com/nexcoderw/ingengo-app/security/policy).
        Use synthetic data and redact payment details, tokens, and message text.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe what you expected to happen and what the app did instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the screen, actions, and relevant permission state. Use synthetic inputs.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and version
      description: Include the OS, device or simulator, and app version or commit.
    validations:
      required: true
